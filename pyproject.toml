[project]
name = "beatbreeder"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cachetools>=7.2.6",
    "flask>=3.1.3",
    "neat-python>=2.0.0",
    "pydantic>=2.14.1",
    "types-cachetools>=7.0.0.20260713",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.basedpyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
